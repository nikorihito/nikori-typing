<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ログイン - ニコリタイピング</title>
  <style>
    :root {
      --bg: #e8fbff;
      --bg2: #b6f2ff;
      --blue: #00a8d8;
      --blue2: #23c7ec;
      --aqua: #58e6f2;
      --yellow: #ffe06e;
      --navy: #06354f;
      --muted: #52788a;
      --line: rgba(0, 118, 165, .18);
      --white: rgba(255,255,255,.76);
      --shadow: 0 22px 60px rgba(0, 100, 145, .18);
      --danger: #ff5d73;
      --good: #16a66f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      color: var(--navy);
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 224, 110, .38), transparent 20%),
        radial-gradient(circle at 82% 12%, rgba(255,255,255,.85), transparent 18%),
        linear-gradient(180deg, #f7feff 0%, var(--bg) 36%, var(--bg2) 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.95) 0 2px, transparent 2.7px),
        radial-gradient(circle, rgba(0,168,216,.24) 0 3px, transparent 3.8px);
      background-size: 120px 120px, 180px 180px;
      background-position: 0 0, 52px 76px;
      animation: bubbles 26s linear infinite;
      opacity: .58;
    }

    body::after {
      content: "";
      position: fixed;
      left: -10%;
      right: -10%;
      bottom: -96px;
      height: 245px;
      z-index: 0;
      pointer-events: none;
      opacity: .9;
      background:
        radial-gradient(130px 58px at 8% 22%, rgba(255,255,255,.54) 0 62%, transparent 64%),
        radial-gradient(150px 64px at 28% 18%, rgba(255,255,255,.38) 0 62%, transparent 64%),
        radial-gradient(160px 68px at 50% 22%, rgba(255,255,255,.48) 0 62%, transparent 64%),
        radial-gradient(150px 64px at 72% 18%, rgba(255,255,255,.38) 0 62%, transparent 64%),
        radial-gradient(170px 72px at 92% 22%, rgba(255,255,255,.50) 0 62%, transparent 64%),
        linear-gradient(180deg, rgba(0,168,216,.08), rgba(0,168,216,.24));
      animation: wave 8s ease-in-out infinite alternate;
    }

    @keyframes bubbles {
      from { transform: translateY(0); }
      to { transform: translateY(120px); }
    }

    @keyframes wave {
      from { transform: translateX(-18px) translateY(0); }
      to { transform: translateX(18px) translateY(-8px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(620px, calc(100% - 28px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      align-items: center;
      padding: 32px 0 48px;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 32px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.64)),
        radial-gradient(circle at 18% 0%, rgba(0,168,216,.14), transparent 34%);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(255,255,255,.45), transparent 28%),
        radial-gradient(circle at 88% 8%, rgba(255,224,110,.30), transparent 20%);
    }

    .card > * {
      position: relative;
      z-index: 1;
    }

    .title-area {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 86px;
      height: 86px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      border: 1px solid rgba(0, 140, 190, .20);
      background:
        url("./ニコリヒト.png") center / 80% no-repeat,
        linear-gradient(135deg, rgba(0,168,216,.18), rgba(255,224,110,.38));
      box-shadow:
        inset 0 -5px 0 rgba(0,120,170,.08),
        0 16px 32px rgba(0,100,145,.16);
    }

    .brand-icon::after {
      content: "NT";
      color: rgba(6,53,79,.28);
      font-weight: 1000;
      font-size: 20px;
      letter-spacing: .06em;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 52px);
      letter-spacing: .06em;
      line-height: 1.15;
    }

    .lead {
      margin: 12px auto 0;
      color: var(--muted);
      font-weight: 800;
      line-height: 1.8;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 20px;
      letter-spacing: .03em;
    }

    .box {
      padding: 18px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.56);
      box-shadow: 0 12px 26px rgba(0, 100, 145, .08);
    }

    .box + .box,
    .box + .error,
    .error + .box,
    .status + .box {
      margin-top: 16px;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
      font-weight: 700;
    }

    label {
      display: block;
      margin: 13px 0 7px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 900;
    }

    input {
      width: 100%;
      border: 1px solid rgba(0, 118, 165, .22);
      border-radius: 18px;
      background: rgba(255,255,255,.78);
      color: var(--navy);
      padding: 14px 15px;
      font-size: 16px;
      font-weight: 800;
      outline: none;
      box-shadow: inset 0 0 0 999px transparent;
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }

    input:focus {
      border-color: rgba(0, 168, 216, .70);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0, 168, 216, .12);
    }

    input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(0, 168, 216, .85);
      outline-offset: 2px;
    }

    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      font-weight: 700;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 12px;
      align-items: end;
    }

    .password-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .password-row .toggle-pass {
      width: auto;
      white-space: nowrap;
      padding: 12px 14px;
      font-size: 13px;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    button,
    .button-link {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      color: var(--navy);
      background: linear-gradient(135deg, var(--blue2) 0%, var(--aqua) 54%, var(--yellow) 100%);
      font-family: inherit;
      font-size: 15px;
      font-weight: 1000;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 13px 26px rgba(0, 122, 170, .20);
      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }

    button:hover,
    .button-link:hover {
      transform: translateY(-2px);
      filter: brightness(1.03);
      box-shadow: 0 18px 34px rgba(0, 122, 170, .24);
    }

    button.secondary,
    .button-link.secondary {
      background: rgba(255,255,255,.68);
      border: 1px solid rgba(0, 118, 165, .18);
      box-shadow: none;
    }

    button.danger {
      color: #fff;
      background: linear-gradient(135deg, var(--danger), #ff90a1);
      box-shadow: 0 12px 24px rgba(255, 93, 115, .18);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      filter: none;
      box-shadow: none;
    }

    .quick-icons {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .quick-icons button {
      min-height: 45px;
      padding: 8px 0;
      border-radius: 16px;
      font-size: 20px;
      background: rgba(255,255,255,.65);
      box-shadow: none;
    }

    .tab-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-switch .tab-btn {
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(0, 118, 165, .18);
      box-shadow: none;
    }

    .tab-switch .tab-btn.active {
      background: linear-gradient(135deg, var(--blue2) 0%, var(--aqua) 54%, var(--yellow) 100%);
    }

    .hidden {
      display: none !important;
    }

    .error {
      display: none;
      padding: 12px 14px;
      border-radius: 18px;
      color: #9f2035;
      background: rgba(255, 93, 115, .12);
      border: 1px solid rgba(255, 93, 115, .22);
      font-size: 13px;
      font-weight: 900;
      line-height: 1.7;
    }

    .error.show {
      display: block;
    }

    .status {
      min-height: 24px;
      margin-top: 12px;
      color: var(--good);
      font-size: 13px;
      font-weight: 900;
      line-height: 1.6;
    }

    .footer-note {
      margin: 18px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      font-weight: 700;
    }

    @media (max-width: 560px) {
      .app {
        width: min(100% - 18px, 620px);
        align-items: start;
        padding-top: 14px;
      }

      .card {
        padding: 18px;
        border-radius: 26px;
      }

      .input-row,
      .split,
      .password-row {
        grid-template-columns: 1fr;
      }

      .quick-icons {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before,
      body::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card" aria-label="ログイン">
      <div class="title-area">
        <div class="brand-icon" aria-hidden="true"></div>
        <h1>ニコリタイピング</h1>
        <p class="lead">タイピングを、もっと楽しく。メールアドレスでログインして練習を始めましょう。</p>
      </div>

      <div class="box" id="checkingBox">
        <p id="checkingText">ログイン状態を確認しています…</p>
      </div>

      <div id="authArea" class="hidden">
        <div class="tab-switch" role="tablist">
          <button type="button" class="tab-btn active" id="tabLoginBtn" role="tab" aria-selected="true" aria-controls="loginForm">ログイン</button>
          <button type="button" class="tab-btn" id="tabSignupBtn" role="tab" aria-selected="false" aria-controls="signupForm">新規登録</button>
        </div>

        <form id="loginForm" class="box" novalidate>
          <h2>ログイン</h2>

          <label for="loginEmail">メールアドレス</label>
          <input id="loginEmail" type="email" autocomplete="email" required placeholder="example@mail.com" />

          <label for="loginPassword">パスワード</label>
          <div class="password-row">
            <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="パスワード" />
            <button type="button" class="secondary toggle-pass" data-target="loginPassword" aria-label="パスワードの表示切り替え">表示</button>
          </div>

          <div class="actions">
            <button type="submit" id="loginSubmitBtn">ログイン</button>
            <button type="button" class="secondary" id="forgotPasswordBtn">パスワードをお忘れですか？</button>
          </div>
        </form>

        <form id="signupForm" class="box hidden" novalidate>
          <h2>新規登録</h2>
          <p>ニックネームとアイコンは、タイピング画面に表示される名前になります。</p>

          <div class="input-row">
            <div>
              <label for="signupEmoji">アイコン</label>
              <input id="signupEmoji" maxlength="4" autocomplete="off" placeholder="例：⌨️" />
            </div>
            <div>
              <label for="signupName">ニックネーム</label>
              <input id="signupName" maxlength="20" autocomplete="nickname" required placeholder="例：こっぴー" />
            </div>
          </div>

          <div class="quick-icons" aria-label="アイコン候補">
            <button type="button" data-emoji="⌨️">⌨️</button>
            <button type="button" data-emoji="🌊">🌊</button>
            <button type="button" data-emoji="💻">💻</button>
            <button type="button" data-emoji="⭐">⭐</button>
            <button type="button" data-emoji="🚀">🚀</button>
            <button type="button" data-emoji="🐬">🐬</button>
          </div>

          <label for="signupEmail">メールアドレス</label>
          <input id="signupEmail" type="email" autocomplete="email" required placeholder="example@mail.com" />

          <label for="signupPassword">パスワード</label>
          <div class="password-row">
            <input id="signupPassword" type="password" autocomplete="new-password" required placeholder="6文字以上" />
            <button type="button" class="secondary toggle-pass" data-target="signupPassword" aria-label="パスワードの表示切り替え">表示</button>
          </div>
          <div class="hint">パスワードは6文字以上で入力してください。</div>

          <div class="actions">
            <button type="submit" id="signupSubmitBtn">新規登録してはじめる</button>
          </div>
        </form>

        <div class="error" id="errorBox" role="alert" aria-live="assertive"></div>
        <div class="status" id="statusText" role="status" aria-live="polite"></div>
      </div>

      <p class="footer-note">メールアドレスは画面上に表示されません。タイピング画面ではニックネームが使われます。</p>
    </section>
  </main>

  <script>
    // Firebase SDK自体の読み込み（CDN）が失敗・タイムアウトした場合、
    // 下の type="module" スクリプトは実行すら始まらないことがあります。
    // それでも「確認中」のまま固まらないよう、依存関係の無い監視タイマーを別途仕込みます。
    (function () {
      "use strict";
      var ready = false;
      window.__nikoriMarkAuthReady = function () { ready = true; };
      window.setTimeout(function () {
        if (ready) return;
        var checkingP = document.querySelector("#checkingBox p");
        if (checkingP) {
          checkingP.textContent = "読み込みに失敗しました。通信環境をご確認のうえ、ページを再読み込みしてください。";
        }
      }, 12000);
    })();
  </script>

  <script type="module">
    "use strict";

    import {
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { auth } from "./firebase-config.js";
    import { mapAuthErrorToMessage } from "./firebase-errors.js";
    import { createUserDocument, migrateLocalStorageIfNeeded } from "./firestore-service.js";

    const el = {
      checkingBox: document.getElementById("checkingBox"),
      authArea: document.getElementById("authArea"),
      tabLoginBtn: document.getElementById("tabLoginBtn"),
      tabSignupBtn: document.getElementById("tabSignupBtn"),
      loginForm: document.getElementById("loginForm"),
      signupForm: document.getElementById("signupForm"),
      loginEmail: document.getElementById("loginEmail"),
      loginPassword: document.getElementById("loginPassword"),
      loginSubmitBtn: document.getElementById("loginSubmitBtn"),
      forgotPasswordBtn: document.getElementById("forgotPasswordBtn"),
      signupEmoji: document.getElementById("signupEmoji"),
      signupName: document.getElementById("signupName"),
      signupEmail: document.getElementById("signupEmail"),
      signupPassword: document.getElementById("signupPassword"),
      signupSubmitBtn: document.getElementById("signupSubmitBtn"),
      errorBox: document.getElementById("errorBox"),
      statusText: document.getElementById("statusText")
    };

    let submitting = false;

    function setError(message) {
      el.errorBox.textContent = message;
      el.errorBox.classList.toggle("show", !!message);
    }

    function setStatus(message) {
      el.statusText.textContent = message || "";
    }

    function setSubmitting(isSubmitting) {
      submitting = isSubmitting;
      el.loginSubmitBtn.disabled = isSubmitting;
      el.signupSubmitBtn.disabled = isSubmitting;
      el.forgotPasswordBtn.disabled = isSubmitting;
    }

    function showTab(tab) {
      const isLogin = tab === "login";
      el.loginForm.classList.toggle("hidden", !isLogin);
      el.signupForm.classList.toggle("hidden", isLogin);
      el.tabLoginBtn.classList.toggle("active", isLogin);
      el.tabSignupBtn.classList.toggle("active", !isLogin);
      el.tabLoginBtn.setAttribute("aria-selected", String(isLogin));
      el.tabSignupBtn.setAttribute("aria-selected", String(!isLogin));
      setError("");
      setStatus("");
    }

    el.tabLoginBtn.addEventListener("click", () => showTab("login"));
    el.tabSignupBtn.addEventListener("click", () => showTab("signup"));

    document.querySelectorAll(".toggle-pass").forEach(button => {
      button.addEventListener("click", () => {
        const target = document.getElementById(button.dataset.target);
        if (!target) return;
        const willShow = target.type === "password";
        target.type = willShow ? "text" : "password";
        button.textContent = willShow ? "隠す" : "表示";
      });
    });

    document.querySelectorAll("[data-emoji]").forEach(button => {
      button.addEventListener("click", () => {
        el.signupEmoji.value = button.dataset.emoji;
      });
    });

    function normalizeEmoji(value) {
      const text = String(value || "").trim();
      return [...text][0] || "⌨️";
    }

    async function afterSignedIn(user) {
      try {
        await migrateLocalStorageIfNeeded(user.uid);
      } catch (err) {
        console.warn("localStorageからの移行に失敗しました。", err);
      }
      window.location.href = "./";
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      if (submitting) return;

      const email = el.loginEmail.value.trim();
      const password = el.loginPassword.value;

      if (!email || !password) {
        setError("メールアドレスとパスワードを入力してください。");
        return;
      }

      setError("");
      setSubmitting(true);
      setStatus("ログインしています…");

      try {
        const credential = await signInWithEmailAndPassword(auth, email, password);
        setStatus("ログインしました。移動しています…");
        await afterSignedIn(credential.user);
      } catch (err) {
        setSubmitting(false);
        setStatus("");
        setError(mapAuthErrorToMessage(err));
      }
    }

    async function handleSignupSubmit(event) {
      event.preventDefault();
      if (submitting) return;

      const email = el.signupEmail.value.trim();
      const password = el.signupPassword.value;
      const displayName = el.signupName.value.trim().slice(0, 20);
      const emoji = normalizeEmoji(el.signupEmoji.value);

      if (!displayName) {
        setError("ニックネームを入力してください。");
        return;
      }
      if (!email || !password) {
        setError("メールアドレスとパスワードを入力してください。");
        return;
      }
      if (password.length < 6) {
        setError("パスワードは6文字以上で入力してください。");
        return;
      }

      setError("");
      setSubmitting(true);
      setStatus("新規登録しています…");

      try {
        const credential = await createUserWithEmailAndPassword(auth, email, password);
        try {
          await updateProfile(credential.user, { displayName });
        } catch (profileErr) {
          console.warn("表示名の設定に失敗しました。", profileErr);
        }
        await createUserDocument(credential.user, { displayName, avatarEmoji: emoji });
        setStatus("登録しました。移動しています…");
        await afterSignedIn(credential.user);
      } catch (err) {
        setSubmitting(false);
        setStatus("");
        setError(mapAuthErrorToMessage(err));
      }
    }

    async function handleForgotPassword() {
      if (submitting) return;
      const email = el.loginEmail.value.trim();
      if (!email) {
        setError("パスワード再設定メールを送るメールアドレスを、ログインの欄に入力してください。");
        return;
      }

      setError("");
      setSubmitting(true);
      setStatus("パスワード再設定メールを送信しています…");

      try {
        await sendPasswordResetEmail(auth, email);
        setStatus("パスワード再設定メールを送信しました。メールをご確認ください。");
      } catch (err) {
        setError(mapAuthErrorToMessage(err));
        setStatus("");
      } finally {
        setSubmitting(false);
      }
    }

    el.loginForm.addEventListener("submit", handleLoginSubmit);
    el.signupForm.addEventListener("submit", handleSignupSubmit);
    el.forgotPasswordBtn.addEventListener("click", handleForgotPassword);

    // モジュール読み込みに成功しここまで実行が到達したことを、body側の監視タイマーへ知らせます
    // （CDN読み込み失敗など、モジュール自体が実行できないケースはbody側のタイマーが引き続き検知します）。
    function markAuthReady() {
      if (window.__nikoriMarkAuthReady) window.__nikoriMarkAuthReady();
    }

    try {
      onAuthStateChanged(
        auth,
        user => {
          markAuthReady();
          if (user) {
            // 既にログイン済みの場合はタイピング画面へ移動
            window.location.replace("./");
            return;
          }
          el.checkingBox.classList.add("hidden");
          el.authArea.classList.remove("hidden");
          showTab("login");
        },
        error => {
          markAuthReady();
          console.error("認証状態の確認に失敗しました。", error);
          el.checkingBox.querySelector("p").textContent =
            "ログイン状態の確認に失敗しました。ページを再読み込みしてください。";
        }
      );
    } catch (err) {
      markAuthReady();
      console.error("Firebaseの初期化に失敗しました。", err);
      el.checkingBox.querySelector("p").textContent =
        "読み込みに失敗しました。ページを再読み込みしてください。";
    }
  </script>
</body>
</html>
