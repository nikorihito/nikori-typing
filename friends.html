<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フレンド | ニコリタイピング</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f7feff,#b6f2ff);min-height:100vh;color:#06354f;font-family:"Yu Gothic",Meiryo,system-ui,sans-serif;padding:22px}main{max-width:750px;margin:auto}section{padding:22px;border-radius:20px;background:#ffffffe6;margin:15px 0}button,a.action{background:#00a8d8;color:#fff;border:0;border-radius:11px;padding:11px 18px;cursor:pointer;font:inherit;display:inline-block;margin:5px;text-decoration:none}button:disabled{opacity:.5}input{padding:12px;border:1px solid #9acbd3;border-radius:9px;font:inherit;max-width:100%;width:320px}#code{font-size:1.5rem;letter-spacing:.12em;font-weight:bold}li{padding:10px;border-bottom:1px solid #dceef1}#status{white-space:pre-wrap;line-height:1.7}small{color:#567}h1{font-size:1.8rem}h2{font-size:1.25rem}
</style></head><body><main><h1>フレンド</h1><p id="status" role="status" aria-live="polite">ログインを確認しています。</p><section><h2>あなたのフレンドコード</h2><p id="code">未発行</p><button id="generate" disabled>フレンドコードを発行</button><button id="copy" disabled>コードをコピー</button><p><small>このコードを教えた相手からフレンド申請を受け取れます。メールアドレスは表示されません。</small></p></section><section><h2>フレンド申請を送る</h2><form id="requestForm"><label for="friendCode">相手のフレンドコード</label><p><input id="friendCode" inputmode="text" maxlength="14" autocomplete="off" placeholder="12文字のコード"><button id="send" disabled>申請する</button></p></form></section><section><h2>届いた申請</h2><button id="refresh" disabled>更新</button><ul id="incoming"><li>申請はありません</li></ul></section><section><h2>フレンド</h2><ul id="friends"><li>まだフレンドはいません</li></ul><small>称号の相互公開やオンライン対戦は、本人以外への読み取り制御と対戦の不正防止を検証後に追加します。</small></section><a class="action" href="./index.html">ゲームに戻る</a><a class="action" href="./firebase-account.html">クラウドアカウント</a></main><script type="module" src="./friends.js"></script></body></html>
