<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ビーフシチュー・タイピング | ニコリタイピング</title>
<style>
:root{font-family:"Yu Gothic",Meiryo,system-ui,sans-serif;color:#06354f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#f6feff,#b6f2ff);padding:20px}main{max-width:900px;margin:auto;background:#ffffffd9;border-radius:24px;padding:24px;box-shadow:0 20px 50px #0064912b}h1{font-size:1.65rem}#speech{display:flex;gap:16px;align-items:center;min-height:82px;background:white;padding:12px;border-radius:16px}#speaker{width:74px;height:74px;object-fit:contain}button,a.button{font:inherit;background:#00a8d8;color:white;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;display:inline-block;text-decoration:none;margin:5px 4px 5px 0}button:disabled{opacity:.45;cursor:not-allowed}.stew{min-height:260px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.pot{font-size:145px;line-height:1;filter:drop-shadow(0 12px 7px #1233)}#steam{position:absolute;top:5px;font-size:35px;animation:bob 2s infinite alternate}@keyframes bob{to{transform:translateY(-14px);opacity:.3}}#falling{position:absolute;inset:0;pointer-events:none}.fall{position:absolute;font-size:28px;font-weight:900;top:10%;left:50%;animation:drop .65s ease-in forwards}@keyframes drop{to{top:71%;transform:translate(-20px,30px) scale(.5);opacity:0}}#letters{font:700 clamp(25px,5vw,45px)/1.7 monospace;min-height:85px;overflow-wrap:anywhere;background:white;border:2px solid #9ed6e7;border-radius:15px;text-align:center;padding:8px;letter-spacing:3px}.fresh{color:#008b6d}.stale{color:#ce3044}.pending{color:#44697c}#entry{font:inherit;padding:12px;border:2px solid #00a8d8;width:100%;border-radius:12px;max-width:500px}#entry:disabled{background:#eee}#quality{font-weight:bold}#result[hidden],#game[hidden],#intro[hidden]{display:none}#result{background:#fff;border-radius:15px;padding:18px;margin-top:15px}#achievement{font-weight:bold;color:#a76300}.bar{height:12px;border-radius:20px;background:#d7e5eb;overflow:hidden}.fill{height:100%;background:#25bd8d;width:100%;transition:width .25s}#hint{font-size:.9rem;color:#567} 
</style></head><body><main><h1>ビーフシチュー・タイピング</h1>
<section id="speech"><img id="speaker" src="./ニコリヒト.png" alt="ニコリヒト"><p id="dialogue">まずはチュートリアルをやってみよう！</p></section>
<section id="intro"><p id="description"></p><button id="start">スタート</button><a class="button" href="./index.html">戻る</a></section>
<section id="game" hidden><p id="quality">鮮度 100%</p><div class="bar"><div id="freshBar" class="fill"></div></div><div class="stew"><div id="steam">♨</div><div class="pot" aria-label="煮込み鍋">🍲</div><div id="falling"></div></div>
<p id="hint">表示されたアルファベットを正しく入力してください。間違えた文字や時間が経った文字は赤くなります。</p><div id="letters" aria-live="off"></div><label for="entry">タイピング入力</label><input id="entry" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="hint">
<p id="progress"></p></section>
<section id="result" hidden><h2 id="resultTitle"></h2><p id="resultText"></p><p id="achievement"></p><button id="again">もう一度</button><a class="button" href="./index.html">マップに戻る</a><a class="button" id="plusLink" href="./stew.html?mode=plus" hidden>＋モードに挑戦</a></section></main><script src="./titles.js" defer></script><script src="./stew.js" defer></script></body></html>
