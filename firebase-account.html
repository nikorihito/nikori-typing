<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>クラウドアカウント | ニコリタイピング</title>
<style>
*{box-sizing:border-box}body{font-family:"Yu Gothic",Meiryo,system-ui,sans-serif;background:linear-gradient(#f7feff,#b6f2ff);color:#06354f;min-height:100vh;margin:0;padding:24px;display:grid;place-items:center}
main{background:#fffffff0;padding:30px;border-radius:25px;width:min(100%,480px);box-shadow:0 15px 45px #00649130}h1{font-size:1.5rem}label{display:block;margin:16px 0 5px;font-weight:bold}input{width:100%;padding:12px;border:1px solid #9ccbd3;border-radius:9px;font:inherit}button,.back{padding:13px 18px;border:0;border-radius:12px;background:#00a8d8;color:white;font:inherit;font-weight:bold;cursor:pointer;margin:12px 5px 0 0}button:disabled{opacity:.4;cursor:not-allowed}.back{background:#496c82;display:inline-block;text-decoration:none}#status{white-space:pre-wrap;line-height:1.6}small{color:#567;line-height:1.7;display:block}
</style></head><body><main>
<h1>クラウドアカウント</h1><p id="status" role="status" aria-live="polite">接続設定を確認しています。</p>
<form id="authForm"><label for="email">メールアドレス</label><input id="email" type="email" name="username" autocomplete="username" required>
<label for="password">パスワード</label><input id="password" type="password" name="password" autocomplete="current-password" minlength="6" required>
<div><button id="login" type="submit" disabled>ログイン</button><button id="register" type="button" disabled>新規登録</button></div><small>新規登録ではパスワードマネージャーの生成候補を利用できます。</small></form>
<button id="logout" type="button" hidden>ログアウト</button><button id="resetPassword" type="button" disabled>パスワードを再設定</button><p><a href="./friends.html">フレンド・フレンドコード</a></p>
<section id="sync" hidden><h2>学習記録の引き継ぎ</h2><p>現在の端末の記録をクラウドに初めて保存できます。既存のクラウド記録がある場合は上書きしません。</p><button id="upload" type="button">ローカルの記録を保存</button><button id="download" type="button">クラウド記録をこの端末へ復元</button></section>
<small>メールとパスワードはFirebase Authenticationが処理します。共有端末ではログアウトしてください。保護者・教室管理者の指示に従って登録してください。従来のIDログインとクラウドアカウントは別の機能です。</small>
<a class="back" href="./index.html">タイピングへ戻る</a>
</main><script type="module" src="./firebase-account.js"></script></body></html>
