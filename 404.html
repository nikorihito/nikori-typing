<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | ページが見つかりません - ニコリタイピング</title>
  <style>
    :root{color-scheme:light;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;color:#06354f}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,#ffe99c70,transparent 25%),linear-gradient(180deg,#f7feff,#b6f2ff)}
    main{width:min(100%,550px);padding:44px 30px;text-align:center;border-radius:28px;background:#ffffffd9;box-shadow:0 22px 60px #0064912e;border:1px solid #ffffff}
    .number{margin:0;font-size:clamp(76px,16vw,124px);font-weight:900;letter-spacing:.03em;color:#00a8d8;line-height:1}
    h1{font-size:clamp(20px,4vw,28px);margin:18px 0 12px}
    p{line-height:1.9;color:#52788a}
    a{display:inline-block;margin-top:18px;padding:13px 27px;border-radius:999px;background:#00a8d8;color:white;text-decoration:none;font-weight:bold;box-shadow:0 8px 20px #00a8d83d}
    a:hover,a:focus-visible{background:#0088b6}
    img{width:110px;max-width:30%;height:auto;object-fit:contain}
  </style>
</head>
<body>
  <main>
    <img src="./ニコリヒト.png" alt="ニコリヒト">
    <p class="number">404</p>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは、移動または削除された可能性があります。<br>トップページからもう一度お試しください。</p>
    <a href="./index.html">タイピングのトップに戻る</a>
  </main>
</body>
</html>
